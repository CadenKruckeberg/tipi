background {
    path = screenshot
    blur_passes = 2
    blur_size = 5
}

input-field {
    size = 300, 60
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    inner_color = rgba(0,0,0,0.5)
    outer_color = rgba(255,255,255,0.3)

    font_color = rgba(255,255,255,1.0)

    fade_on_empty = false

    position = 0, 0
    halign = center
    valign = center
}

label {
    text = Mod + M to Logout

    position = 0, -45
    halign = center
    valign = center

    font_size = 9
    color = rgba(255,255,255,0.35)
}
