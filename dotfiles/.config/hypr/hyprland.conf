# https://wiki.hypr.land/Configuring/

################
### MONITORS ###
################

monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################

$terminal = ghostty
$fileManager = nemo
# $menu = wofi --show drun
$menu = fuzzel


#################
### AUTOSTART ###
#################

exec-once = hyprpaper
exec-once = hypridle
exec-once = hyprctl setcursor Vanilla-DMZ-AA 24


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Vanilla-DMZ-AA
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Vanilla-DMZ-AA
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 2
    gaps_out = 0

    border_size = 1

    # col.active_border = rgba(ffffffff)
    col.active_border = rgba(ffffff8f) rgba(ffffff00) 0deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 0

    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = no
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 1
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.6

    touchpad {
        natural_scroll = false
    }
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, R, exec, hyprctl reload
bind = $mainMod, Space, exec, $menu
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = , Print, exec, hyprshot -m output --clipboard-only --freeze
bind = $mainMod, G, exec, pkill waybar || waybar

bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
# bind = $mainMod, J, togglesplit,

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, h, workspace, 1
bind = $mainMod, j, workspace, 2
bind = $mainMod, k, workspace, 3
bind = $mainMod, l, workspace, 4
bind = $mainMod, semicolon, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, h, movetoworkspace, 1
bind = $mainMod SHIFT, j, movetoworkspace, 2
bind = $mainMod SHIFT, k, movetoworkspace, 3
bind = $mainMod SHIFT, l, movetoworkspace, 4
bind = $mainMod SHIFT, semicolon, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, pamixer -i 8 && paplay ~/.nix-profile/share/mint-artwork/sounds/volume.oga
bindel = ,XF86AudioLowerVolume, exec, pamixer -d 8 && paplay ~/.nix-profile/share/mint-artwork/sounds/volume.oga
bindel = ,XF86AudioMute, exec, pamixer -t
bindel = ,XF86AudioMicMute, exec, pamixer --default-source -t
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 8%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 8%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppressevent maximize, class:.*

windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
